- name: Install docker (Arch)
  pacman:
    name:
      - docker
      - docker-compose
    state: present

- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: true

- name: Add current user to docker group
  user:
    name: "{{ ansible_env.USER }}"
    groups: docker
    append: true

- name: Create app directory
  file:
    path: /opt/monitoring
    state: directory
    mode: '0755'

- name: Copy stack files
  copy:
    src: "{{ item }}"
    dest: /opt/monitoring/
  loop:
    - docker-compose.yml
    - prometheus.yml
    - nginx.conf

- name: Run docker compose
  community.docker.docker_compose_v2:
    project_src: /opt/monitoring
    state: present
